name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt pytest httpx

      - name: Get dataset
        run: python data/download_data.py

      - name: Tests and quality gate
        run: pytest -v

      - name: Build image
        run: docker build -t churn-api:ci .

      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name churn-api churn-api:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health | grep -q '"status":"ok"'
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d @sample_request.json | tee /dev/stderr | grep -q churn_probability
